name: Build and Test
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'appcast.xml']
  pull_request:
    paths-ignore: ['**.md', 'appcast.xml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: swift build
      - name: Core and MCP tests (no inference or recording)
        run: swift test --filter 'RepriseCoreTests|RepriseMCPTests'
      - name: Stdio protocol smoke check
        run: node script/check_mcp.mjs .build/debug/RepriseMCP
